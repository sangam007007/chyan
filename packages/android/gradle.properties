org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── What the app opens ────────────────────────────────────────────────────────
# The app is a Trusted Web Activity: it shows your website full screen. Set the real address of your
# deployed site (https only for the Play Store build) before building the release:
#   ./gradlew bundleRelease -PtwaUrl=https://your-domain.com/dashboard
twaUrl=https://REPLACE-WITH-YOUR-DOMAIN.example/dashboard

# ── Play Store identity (the package name can never be changed after the first upload) ─
appId=com.chayan.app
versionCode=1
versionName=1.0.0
